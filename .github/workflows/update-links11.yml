name: Update YouTube Tamil News Links22

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST = 12:30 AM UTC
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create script directory
        run: mkdir -p scripts

      - name: Create YouTube fetcher script (With 5-Day Recent Check)
        run: |
          cat > scripts/youtube_fetcher.py << 'SCRIPT_EOF'
          #!/usr/bin/env python3

          import json
          import os
          import sys
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urlencode
          from datetime import datetime, timedelta

          YOUTUBE_API_KEY = os.getenv('YOUTUBE_API_KEY')

          SEARCH_QUERIES = [
              'tamil news live',
              'தமிழ் செய்திகள் live',
              'தமிழ் news 24/7',
          ]

          EXISTING_CHANNELS = {
              '6xCrWQEcJZM': {'title': 'Polimer News', 'logo': '/assets/logo/aa.png'},
              '9M02G5c6x6w': {'title': 'Sun News', 'logo': '/assets/logo/1.jpg'},
              '8kjza8MzPXE': {'title': 'Thanthi TV', 'logo': '/assets/logo/7.jpg'},
              'uXuh15qCgGo': {'title': 'malaimurasu live', 'logo': '/assets/logo/12.jpg'},
              'g_7IQn8BDro': {'title': 'Kalaigar news', 'logo': '/assets/logo/11.jpg'},
              'gynWNinqmjw': {'title': 'News 24/7 live', 'logo': '/assets/logo/10.jpg'},
              'X_p2Z8NAq5U': {'title': 'News 7 Tamil', 'logo': '/assets/logo/4.jpg'},
              'iZ6nFcBTMh4': {'title': 'News 18 Tamil Nadu', 'logo': '/assets/logo/5.jpg'},
              'VNzHENanD0g': {'title': 'Puthiya Thalaimurai', 'logo': '/assets/logo/6.jpg'},
              'cQSnvl4DqwY': {'title': 'News J Live', 'logo': '/assets/logo/8.jpg'},
              'NHqqu4SbhZI': {'title': 'zee live', 'logo': '/assets/logo/9.jpg'}
          }

          def make_request(url):
              try:
                  with urlopen(url, timeout=10) as response:
                      return json.loads(response.read().decode())
              except Exception as e:
                  print(f"Request error: {e}")
                  return None

          def is_news_channel(channel_info):
              if not channel_info:
                  return False
              
              snippet = channel_info.get('snippet', {})
              title = snippet.get('title', '').lower()
              description = snippet.get('description', '').lower()
              
              news_keywords = ['Polimer News live', 'Sun News live', 'Thanthi TV live', 'malaimurasu live', 'Kalaigar news live', 'News 24/7 live tamil live','News 7 Tamil live','News 18 Tamil Nadu live','Puthiya Thalaimurai live','News J Live']
              keyword_count = sum(1 for kw in news_keywords if kw in title or kw in description)
              
              return keyword_count >= 1

          def is_active_channel(channel_info):
              if not channel_info:
                  return False
              
              description = channel_info.get('snippet', {}).get('description', '')
              return len(description) > 10

          def has_recent_live_content(channel_id):
              """Check if channel has gone live in the last 5 days"""
              if not YOUTUBE_API_KEY:
                  return False
              
              try:
                  # Get channel's upload playlist
                  params = urlencode({
                      'part': 'contentDetails',
                      'id': channel_id,
                      'key': YOUTUBE_API_KEY
                  })
                  url = f'https://www.googleapis.com/youtube/v3/channels?{params}'
                  data = make_request(url)
                  
                  if not data or 'items' not in data or len(data['items']) == 0:
                      return False
                  
                  uploads_playlist_id = data['items'][0]['contentDetails']['relatedPlaylists']['uploads']
                  
                  # Get latest videos from uploads
                  params = urlencode({
                      'part': 'snippet',
                      'playlistId': uploads_playlist_id,
                      'maxResults': 20,  # Check last 20 videos
                      'key': YOUTUBE_API_KEY,
                      'order': 'date'
                  })
                  url = f'https://www.googleapis.com/youtube/v3/playlistItems?{params}'
                  data = make_request(url)
                  
                  if not data or 'items' not in data:
                      return False
                  
                  # Calculate date from 5 days ago
                  five_days_ago = datetime.utcnow() - timedelta(days=5)
                  
                  # Check if any recent video is from last 5 days
                  for item in data['items']:
                      publish_date_str = item['snippet']['publishedAt']
                      publish_date = datetime.fromisoformat(publish_date_str.replace('Z', '+00:00'))
                      
                      if publish_date > five_days_ago:
                          title = item['snippet']['title'][:50]
                          print(f'   ✅ Recent: {title} ({publish_date.strftime("%Y-%m-%d")})')
                          return True
                  
                  print(f'   ❌ No broadcasts in last 5 days')
                  return False
                  
              except Exception as e:
                  print(f"   Error checking recent content: {e}")
                  return False

          def search_channels(query):
              if not YOUTUBE_API_KEY:
                  print('⚠️  YOUTUBE_API_KEY not set. Using existing channels only.')
                  return []

              try:
                  params = urlencode({
                      'part': 'snippet',
                      'q': query,
                      'type': 'channel',
                      'maxResults': 5,
                      'key': YOUTUBE_API_KEY,
                      'order': 'relevance',
                  })
                  url = f'https://www.googleapis.com/youtube/v3/search?{params}'
                  data = make_request(url)
                  return data.get('items', []) if data else []
              except Exception as e:
                  print(f"Error searching for '{query}': {e}")
                  return []

          def get_channel_info(channel_id):
              if not YOUTUBE_API_KEY:
                  return None

              try:
                  params = urlencode({
                      'part': 'snippet,statistics',
                      'id': channel_id,
                      'key': YOUTUBE_API_KEY
                  })
                  url = f'https://www.googleapis.com/youtube/v3/channels?{params}'
                  data = make_request(url)
                  items = data.get('items', []) if data else []
                  return items[0] if items else None
              except Exception as e:
                  print(f"Error fetching channel info: {e}")
                  return None

          def normalize_title(title):
              normalized = title.lower().strip()
              suffixes = [' - topic', ' topic', ' official', ' live', ' channel']
              for suffix in suffixes:
                  if normalized.endswith(suffix):
                      normalized = normalized[:-len(suffix)].strip()
              return normalized

          def build_channel_link(channel_id, title, logo=None, category='தமிழ் News'):
              return {
                  'id': channel_id,
                  'url': f'https://www.youtube.com/live/{channel_id}?si=updated',
                  'title': title.replace(' - Topic', ''),
                  'logo': logo or f'/assets/logo/{abs(hash(channel_id)) % 12 + 1}.jpg',
                  'category': category
              }

          def update_links_json():
              try:
                  print('🚀 Starting YouTube links update...')
                  print(f'📅 Checking for channels with broadcasts in last 5 days\n')

                  links = [
                      build_channel_link(ch_id, info['title'], info['logo'])
                      for ch_id, info in EXISTING_CHANNELS.items()
                  ]

                  print(f'✅ Keeping {len(links)} existing channels')

                  existing_ids = set(EXISTING_CHANNELS.keys())
                  existing_titles = {normalize_title(info['title']) for info in EXISTING_CHANNELS.values()}

                  if YOUTUBE_API_KEY:
                      new_channels_found = 0
                      checked_channels = set()
                      
                      for query in SEARCH_QUERIES:
                          print(f'\n🔍 Searching for: "{query}"')
                          results = search_channels(query)
                          print(f'   Found {len(results)} results')

                          for item in results:
                              channel_id = item['snippet']['channelId']
                              
                              if channel_id in checked_channels:
                                  continue
                              
                              checked_channels.add(channel_id)
                              
                              if channel_id in existing_ids:
                                  continue
                              
                              channel_info = get_channel_info(channel_id)
                              
                              if not channel_info:
                                  continue
                              
                              title = channel_info['snippet']['title']
                              normalized = normalize_title(title)
                              
                              if normalized in existing_titles:
                                  print(f'   🔁 Skipping "{title}" (duplicate)')
                                  continue
                              
                              if not is_news_channel(channel_info):
                                  print(f'   ❌ Skipping "{title}" (not news)')
                                  continue
                              
                              if not is_active_channel(channel_info):
                                  print(f'   ❌ Skipping "{title}" (inactive)')
                                  continue
                              
                              # 🔥 KEY: Check if channel has recent live content (last 5 days)
                              print(f'   📺 Checking recent broadcasts for "{title}"...')
                              if not has_recent_live_content(channel_id):
                                  continue
                              
                              stats = channel_info.get('statistics', {})
                              subscriber_count = stats.get('subscriberCount', 'N/A')
                              
                              print(f'   ✨ Added: "{title}" ({subscriber_count} subs)')
                              
                              new_link = build_channel_link(channel_id, title)
                              links.append(new_link)
                              existing_ids.add(channel_id)
                              existing_titles.add(normalized)
                              new_channels_found += 1
                              
                              if new_channels_found >= 3:
                                  break
                          
                          if new_channels_found >= 3:
                              break

                      print(f'\n📝 Found {new_channels_found} new channels with recent broadcasts')

                  unique_links = {}
                  for link in links:
                      if link['id'] not in unique_links:
                          unique_links[link['id']] = link
                  
                  sorted_links = sorted(unique_links.values(), key=lambda x: x['title'])

                  output_dir = Path('src/data')
                  output_dir.mkdir(parents=True, exist_ok=True)

                  output_path = output_dir / 'links.json'
                  with open(output_path, 'w', encoding='utf-8') as f:
                      json.dump(sorted_links, f, indent=2, ensure_ascii=False)

                  print(f'\n✅ Successfully updated {len(sorted_links)} channels')
                  
                  print('\n📊 Final List:')
                  for link in sorted_links:
                      print(f'   • {link["title"]}')
                  
                  return sorted_links

              except Exception as e:
                  print(f'❌ Error: {e}')
                  import traceback
                  traceback.print_exc()
                  sys.exit(1)

          if __name__ == '__main__':
              update_links_json()
          SCRIPT_EOF

      - name: Run YouTube links update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/youtube_fetcher.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/links.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/data/links.json
          git commit -m "chore: update youtube tamil news links - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Create tag
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          TAG="links-update-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
