name: Update YouTube Tamil News Links1111

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create script directory
        run: mkdir -p scripts

      - name: Create YouTube fetcher script
        run: |
          cat > scripts/youtube-fetcher.js << 'SCRIPT_EOF'
          #!/usr/bin/env node
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const YOUTUBE_API_KEY = process.env.YOUTUBE_API_KEY;
          const SEARCH_QUERIES = [
            'tamil news live 24/7',
            'tamil news channel live',
            'விஸ்வாசம் நியூஸ் live'
          ];

          const EXISTING_CHANNELS = {
            '6xCrWQEcJZM': { title: 'Polimer News', logo: '/assets/logo/aa.png' },
            '9M02G5c6x6w': { title: 'Sun News', logo: '/assets/logo/1.jpg' },
            '8kjza8MzPXE': { title: 'Thanthi TV', logo: '/assets/logo/7.jpg' },
            'uXuh15qCgGo': { title: 'malaimurasu live', logo: '/assets/logo/12.jpg' },
            'g_7IQn8BDro': { title: 'Kalaigar news', logo: '/assets/logo/11.jpg' },
            'gynWNinqmjw': { title: 'News 24/7 live', logo: '/assets/logo/10.jpg' },
            'X_p2Z8NAq5U': { title: 'News 7 Tamil', logo: '/assets/logo/4.jpg' },
            'iZ6nFcBTMh4': { title: 'News 18 Tamil Nadu', logo: '/assets/logo/5.jpg' },
            'VNzHENanD0g': { title: 'Puthiya Thalaimurai', logo: '/assets/logo/6.jpg' },
            'cQSnvl4DqwY': { title: 'News J Live', logo: '/assets/logo/8.jpg' },
            'NHqqu4SbhZI': { title: 'zee live', logo: '/assets/logo/9.jpg' }
          };

          function makeHttpRequest(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch (e) {
                    reject(new Error(`Failed to parse JSON: ${e.message}`));
                  }
                });
              }).on('error', reject);
            });
          }

          async function searchLiveStreams(query) {
            if (!YOUTUBE_API_KEY) {
              console.log('⚠️  YOUTUBE_API_KEY not set. Using existing channels only.');
              return [];
            }

            try {
              const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=channel&maxResults=3&key=${YOUTUBE_API_KEY}`;
              const response = await makeHttpRequest(url);
              return response.items || [];
            } catch (error) {
              console.error(`Error searching for "${query}":`, error.message);
              return [];
            }
          }

          async function getChannelInfo(channelId) {
            if (!YOUTUBE_API_KEY) {
              return null;
            }

            try {
              const url = `https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${channelId}&key=${YOUTUBE_API_KEY}`;
              const response = await makeHttpRequest(url);
              return response.items?.[0] || null;
            } catch (error) {
              console.error(`Error fetching channel info for ${channelId}:`, error.message);
              return null;
            }
          }

          function buildChannelLink(id, title, logo = null, category = 'தமிழ் News') {
            return {
              id,
              url: `https://www.youtube.com/live/${id}?si=updated`,
              title: title.replace(' - Topic', ''),
              logo: logo || `/assets/logo/${Math.floor(Math.random() * 12) + 1}.jpg`,
              category
            };
          }

          async function updateLinksJson() {
            try {
              console.log('🚀 Starting YouTube links update...');
              
              const links = Object.entries(EXISTING_CHANNELS).map(([id, info]) =>
                buildChannelLink(id, info.title, info.logo)
              );

              console.log(`✅ Keeping ${links.length} existing channels`);

              if (YOUTUBE_API_KEY) {
                let newChannelsFound = 0;
                const existingIds = new Set(Object.keys(EXISTING_CHANNELS));

                for (const query of SEARCH_QUERIES) {
                  console.log(`🔍 Searching for: "${query}"`);
                  const results = await searchLiveStreams(query);

                  for (const item of results) {
                    const channelId = item.snippet.channelId;
                    
                    if (!existingIds.has(channelId) && newChannelsFound < 3) {
                      const channelInfo = await getChannelInfo(channelId);
                      if (channelInfo) {
                        const newLink = buildChannelLink(channelId, channelInfo.snippet.title);
                        links.push(newLink);
                        existingIds.add(channelId);
                        newChannelsFound++;
                        console.log(`  ✨ Added: ${channelInfo.snippet.title}`);
                      }
                    }
                  }

                  if (newChannelsFound >= 3) break;
                }

                console.log(`📝 Found ${newChannelsFound} new channels`);
              }

              const uniqueLinks = Array.from(
                new Map(links.map(link => [link.id, link])).values()
              );

              uniqueLinks.sort((a, b) => a.title.localeCompare(b.title));

              const outputDir = path.dirname('src/data/links.json');
              if (!fs.existsSync(outputDir)) {
                fs.mkdirSync(outputDir, { recursive: true });
              }

              const outputPath = path.join(process.cwd(), 'src/data/links.json');
              fs.writeFileSync(outputPath, JSON.stringify(uniqueLinks, null, 2), 'utf-8');

              console.log(`✅ Successfully updated ${uniqueLinks.length} channels in links.json`);
              return uniqueLinks;
            } catch (error) {
              console.error('❌ Error updating links:', error);
              process.exit(1);
            }
          }

          updateLinksJson();
          SCRIPT_EOF

      - name: Run YouTube links update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube-fetcher.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/links.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/data/links.json
          git commit -m "chore: update youtube tamil news links - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Create tag
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          TAG="links-update-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
