name: Update YouTube Tamil Live News Links

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create directories
        run: |
          mkdir -p scripts
          mkdir -p src/data

      - name: Create fetcher script
        run: |
          cat > scripts/youtube_fetcher.py << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.parse import urlencode

          YOUTUBE_API_KEY = os.getenv('YOUTUBE_API_KEY')

          EXISTING_CHANNELS = {
              '6xCrWQEcJZM': {'title': 'Polimer News', 'logo': '/assets/logo/aa.png'},
              '9M02G5c6x6w': {'title': 'Sun News', 'logo': '/assets/logo/1.jpg'},
              '8kjza8MzPXE': {'title': 'Thanthi TV', 'logo': '/assets/logo/7.jpg'},
              'uXuh15qCgGo': {'title': 'Malaimurasu', 'logo': '/assets/logo/12.jpg'},
              'g_7IQn8BDro': {'title': 'Kalaignar News', 'logo': '/assets/logo/11.jpg'},
              'gynWNinqmjw': {'title': 'News 24/7', 'logo': '/assets/logo/10.jpg'},
              'X_p2Z8NAq5U': {'title': 'News 7 Tamil', 'logo': '/assets/logo/4.jpg'},
              'iZ6nFcBTMh4': {'title': 'News 18 Tamil Nadu', 'logo': '/assets/logo/5.jpg'},
              'VNzHENanD0g': {'title': 'Puthiya Thalaimurai', 'logo': '/assets/logo/6.jpg'},
              'cQSnvl4DqwY': {'title': 'News J Live', 'logo': '/assets/logo/8.jpg'}
          }

          def make_request(url):
              try:
                  with urlopen(url, timeout=10) as response:
                      return json.loads(response.read().decode('utf-8'))
              except Exception as e:
                  print(f"API ERROR: {e}")
                  return None

          def get_live_video(channel_id):
              params = urlencode({
                  'part': 'snippet',
                  'channelId': channel_id,
                  'eventType': 'live',
                  'type': 'video',
                  'maxResults': 1,
                  'key': YOUTUBE_API_KEY,
              })

              url = f'https://www.googleapis.com/youtube/v3/search?{params}'
              data = make_request(url)

              if not data or 'items' not in data or len(data['items']) == 0:
                  return None

              item = data['items'][0]

              return {
                  'id': channel_id,
                  'url': f"https://www.youtube.com/watch?v={item['id']['videoId']}",
                  'title': EXISTING_CHANNELS[channel_id]['title'],
                  'logo': EXISTING_CHANNELS[channel_id]['logo'],
                  'category': 'தமிழ் News'
              }

          print("🔴 Fetching LIVE Tamil News...\n")

          if not YOUTUBE_API_KEY:
              print("❌ Missing API KEY")
              sys.exit(1)

          links = []

          for ch_id, info in EXISTING_CHANNELS.items():
              print(f"🔎 {info['title']}")

              live = get_live_video(ch_id)

              if not live:
                  print("   ❌ Not Live")
                  continue

              print("   ✅ LIVE")
              links.append(live)

          final = sorted(links, key=lambda x: x['title'])

          Path('src/data').mkdir(parents=True, exist_ok=True)

          with open('src/data/links.json', 'w', encoding='utf-8') as f:
              json.dump(final, f, indent=2, ensure_ascii=False)

          print(f"\n✅ Saved {len(final)} LIVE channels")
          EOF

      - name: Run script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/youtube_fetcher.py

      - name: Check changes
        id: check
        run: |
          if git diff --quiet src/data/links.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add src/data/links.json
          git commit -m "update live links $(date +'%Y-%m-%d %H:%M')"
          git push
