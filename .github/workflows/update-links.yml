name: Update YouTube Tamil News Links

on:
  # Scheduled run - every day at 6 AM UTC (11:30 AM IST)
  schedule:
    - cron: '0 6 * * *'
  
  # Manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js (FIXED - using 24 instead of 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      # Step 3: Run YouTube links update
      - name: Run YouTube links update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube-fetcher.js
      
      # Step 4: Check if links.json changed
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/data/links.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes to links.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in links.json"
          fi
      
      # Step 5: Configure git
      - name: Configure git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      # Step 6: Commit changes
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add src/data/links.json
          git commit -m "chore: update youtube tamil news links - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
      
      # Step 7: Create version tag
      - name: Create version tag
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          TAG="links-update-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
